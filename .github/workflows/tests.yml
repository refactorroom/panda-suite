name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      # Network-free: threat-intelligence tests mock all HTTP calls.
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/validate-skills.py
      # tests/check_codex_discovery.py is not run here: it needs a local
      # Codex CLI (`codex app-server`), which CI runners do not have.
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: node --test tests/npm-cli.test.js tests/update-notice.test.js
